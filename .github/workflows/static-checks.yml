name: static-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight checks
        run: python -m pip install -r requirements/ci.txt

      - name: Compile Python sources
        run: python -m compileall -q scripts src third_party

      - name: Validate shell syntax
        run: |
          bash -n config/experiment.env
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Validate JSON and YAML syntax
        run: |
          python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]"
          python -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.yml')]; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.yaml')]"

      - name: Check public-repository safety
        run: python scripts/verify_public_repo.py .

      - name: Lightweight unit tests
        run: python -m pytest -q -m "not integration"

      - name: Check whitespace
        run: git diff --check
